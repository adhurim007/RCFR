<div class="flex flex-col flex-auto w-full p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold text-gray-800">
      Roles
    </h1>

    <button
      mat-flat-button
      color="primary"
      class="px-6"
      (click)="openCreateDialog()">
      <mat-icon class="mr-2">add</mat-icon>
      Create Role
    </button>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-xl shadow border border-gray-200 w-full overflow-x-auto">

    <table class="min-w-full text-sm text-left text-gray-700">
      <thead class="bg-gray-100 text-xs uppercase text-gray-600">
        <tr>
          <th class="px-6 py-3">Role Name</th>
          <th class="px-6 py-3 text-right">Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let role of roles" class="border-b hover:bg-gray-50">
          <td class="px-6 py-4 font-medium">
            {{ role.name }}
          </td>

          <td class="px-6 py-4 text-right">
            <button
              mat-icon-button
              [matMenuTriggerFor]="roleMenu"
              (click)="selectedRole = role">
              <mat-icon>more_vert</mat-icon>
            </button>
          </td>
        </tr>

        <!-- Empty -->
        <tr *ngIf="!loading && roles.length === 0">
          <td colspan="2" class="text-center py-6 text-gray-400">
            No roles found.
          </td>
        </tr>

      </tbody>
    </table>

    <!-- Menu -->
    <mat-menu #roleMenu="matMenu">

      <button mat-menu-item (click)="openEditDialog(selectedRole)">
        <mat-icon>edit</mat-icon>
        <span>Edit</span>
      </button>

      <mat-divider></mat-divider>

      <button
        mat-menu-item
        class="text-red-600"
        (click)="deleteRole(selectedRole?.id)">
        <mat-icon color="warn">delete</mat-icon>
        <span>Delete</span>
      </button>

    </mat-menu>

    <!-- Loading -->
    <div *ngIf="loading" class="p-6 text-center text-gray-400">
      Loading...
    </div>

  </div>
</div>
