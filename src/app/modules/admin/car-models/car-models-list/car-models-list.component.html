<div class="flex flex-col flex-auto w-full p-6">

  <div class="flex items-center justify-between mb-6 w-full">
    <h1 class="text-2xl font-semibold">
      {{ 'CAR_MODELS.LIST_TITLE' | transloco }}
    </h1>

    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon class="mr-2">add</mat-icon>
      {{ 'CAR_MODELS.ADD_BUTTON' | transloco }}
    </button>
  </div>

  <div class="bg-white rounded-lg shadow border border-gray-200 w-full overflow-auto">

    <table mat-table [dataSource]="models" class="w-full">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-3">
          {{ 'CAR_MODELS.TABLE.MODEL' | transloco }}
        </th>
        <td mat-cell *matCellDef="let row" class="px-4 py-3">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="brand">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-3">
          {{ 'CAR_MODELS.TABLE.BRAND' | transloco }}
        </th>
        <td mat-cell *matCellDef="let row" class="px-4 py-3">
          {{ row.carBrandName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-3 text-right">
          {{ 'COMMON.ACTIONS' | transloco }}
        </th>

        <td mat-cell *matCellDef="let row" class="px-4 py-3 text-right">
          <button mat-icon-button color="primary" (click)="openEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="delete(row.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <div *ngIf="models?.length === 0" class="p-6 text-center text-gray-500">
      {{ 'CAR_MODELS.NO_DATA' | transloco }}
    </div>

  </div>

</div>
