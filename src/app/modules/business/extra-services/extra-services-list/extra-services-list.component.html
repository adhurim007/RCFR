<div class="flex flex-col flex-auto w-full p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold text-gray-800">
      {{ 'EXTRA_SERVICES.LIST_TITLE' | transloco }}
    </h1>

    <button
      mat-flat-button
      color="primary"
      class="px-6"
      (click)="openCreate()">
      <mat-icon class="mr-2">add</mat-icon>
      {{ 'EXTRA_SERVICES.ADD_BUTTON' | transloco }}
    </button>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-xl shadow border border-gray-200 w-full overflow-x-auto">

    <table class="min-w-full text-sm text-left text-gray-700">
      <thead class="bg-gray-100 text-xs uppercase text-gray-600">
        <tr>
          <th class="px-6 py-3">{{ 'COMMON.NAME' | transloco }}</th>
          <th class="px-6 py-3">{{ 'EXTRA_SERVICES.TABLE.PRICE_PER_DAY' | transloco }}</th>
          <th class="px-6 py-3 text-right">{{ 'COMMON.ACTIONS' | transloco }}</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let s of services" class="border-b hover:bg-gray-50">
          <td class="px-6 py-4">{{ s.name }}</td>
          <td class="px-6 py-4">{{ s.pricePerDay | number:'1.2-2' }} €</td>

          <td class="px-6 py-4 text-right">
            <button
              mat-icon-button
              [matMenuTriggerFor]="extraMenu"
              (click)="selectedService = s">
              <mat-icon>more_vert</mat-icon>
            </button>
          </td>
        </tr>

        <!-- Empty -->
        <tr *ngIf="!loading && services.length === 0">
          <td colspan="3" class="text-center py-6 text-gray-400">
            {{ 'EXTRA_SERVICES.NO_DATA' | transloco }}
          </td>
        </tr>

      </tbody>
    </table>

    <!-- Menu -->
    <mat-menu #extraMenu="matMenu">
      <button mat-menu-item (click)="openEdit(selectedService)">
        <mat-icon>edit</mat-icon>
        <span>{{ 'COMMON.EDIT' | transloco }}</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item class="text-red-600" (click)="delete(selectedService?.id)">
        <mat-icon color="warn">delete</mat-icon>
        <span>{{ 'COMMON.DELETE' | transloco }}</span>
      </button>
    </mat-menu>

    <!-- Loading -->
    <div *ngIf="loading" class="p-6 text-center text-gray-400">
      {{ 'COMMON.LOADING' | transloco }}
    </div>

  </div>
</div>
